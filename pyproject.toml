[project]
name = "market-data-agent"
version = "0.1.0"
description = "CLI agent that answers equity questions by calling market data tools through the Claude API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "anthropic==1.13.0",
    "pydantic==2.14.1",
    "python-dotenv==1.2.4",
    "yfinance==1.7.0",
]

[project.scripts]
market-agent = "market_data_agent.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
